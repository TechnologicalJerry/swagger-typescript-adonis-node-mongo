version: '3.8'

services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: adonis_api
    restart: unless-stopped
    ports:
      - "3333:3333"
    environment:
      - PORT=3333
      - HOST=0.0.0.0
      - NODE_ENV=development
      - APP_KEY=a-very-long-secure-random-key-replace-me-in-production
      - MONGO_URI=mongodb://root:example@mongodb:27017/adonis_db?authSource=admin
      - JWT_ACCESS_SECRET=your-access-token-secret-key-change-me
      - JWT_REFRESH_SECRET=your-refresh-token-secret-key-change-me
      - JWT_ACCESS_EXPIRATION=15m
      - JWT_REFRESH_EXPIRATION=7d
    depends_on:
      mongodb:
        condition: service_healthy
    volumes:
      - .:/app
      - /app/node_modules

  mongodb:
    image: mongo:latest
    container_name: adonis_mongodb
    restart: unless-stopped
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_ROOT_USERNAME: root
      MONGO_INITDB_ROOT_PASSWORD: example
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: echo 'db.runCommand("ping").ok' | mongosh localhost:27017/test --quiet
      interval: 10s
      timeout: 10s
      retries: 5
      start_period: 40s

volumes:
  mongo_data:
